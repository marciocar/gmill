  # ═══════════════════ MERCADO/CAPITAL E LACUNAS (clausulas 4 e 8) ═══════════════════

  - id: E_MERCADO_AUTH_2026_09
    node_type: evidence
    plane: DEV
    status: confirmed
    impact: 3
    confidence: 0.6
    verified_at: 2026-09-30
    verified_against: 'sintese do eixo mercado/capital da rodada de 2026-09-30 — ausencia de sinal medida; texto do sintetizador chegou truncado no fim'
    source_tier: 8
    source_kind: analyst
    label: 'SEM SINAL DE CAPITAL: nenhuma rodada, M&A ou valuation de fornecedor de identidade (Okta/Auth0, WorkOS, Clerk, FusionAuth etc.) foi confirmada. O unico sinal de fornecedor (Auth0 lancando OAuth 2.1 e separacao de tokens de agente e de humano em out/2025) foi refutado, assim como as cotacoes por MAU e o TCO Keycloak x FusionAuth x Auth0. Quem converge sao os analistas: Thoughtworks com passkeys em Adopt (abr/2026, E_TW_RADAR_PASSKEYS_ADOPT) e KuppingerCole (EIC26) defendendo a passagem de sessao estatica para confianca continua (E_SSF_CAEP_CONTINUOUS_TRUST). O texto do sintetizador terminou cortado nesse ponto.'
    trace: 'https://www.thoughtworks.com/es-cl/radar/techniques/passkeys'

  - id: E_LACUNAS_AUTH_2026_09
    node_type: evidence
    plane: DEV
    status: confirmed
    impact: 4
    confidence: 0.9
    verified_at: 2026-09-30
    verified_against: 'inventario do que esta rodada NAO fechou — ausencia medida, nao esquecida'
    source_tier: 10
    source_kind: primary
    label: 'LACUNAS. REFUTADAS (7, nenhuma virou no): (1) IAM tradicional so valida confianca no login, com assertions SAML e tokens OIDC imutaveis apos emissao (KuppingerCole, tier 7; o mesmo video sustenta E_SSF_CAEP_CONTINUOUS_TRUST); (2) passkeys-as-default virou a forca principal na compra de CIAM, com SMS OTP saindo do AAL2 (guptadeepak, tier 5); (3) Auth0 lancou OAuth 2.1 e separacao agente-vs-humano em out/2025 (guptadeepak, tier 5); (4) preco a 100k MAU: WorkOS US$0, Entra External ID US$165, Cognito US$275, Auth0 US$1.200 (guptadeepak, tier 4); (5) Keycloak ~US$5.000/mes a 1M MAU contra FusionAuth US$3.000 e Auth0 US$9.500 (guptadeepak, tier 4); (6) backup de passkey no Apple Passwords/Keychain nao restauravel entre Macs (mjtsai, tier 4); (7) SAML, SCIM e audit logs como requisitos criticos de CIAM B2B em 2026 (guptadeepak, tier 4). Seis das sete tinham tier 4-5, e cinco vieram do mesmo agregador. NAO VERIFICADAS: 0. CORTE POR ORCAMENTO: a rodada parou em 43 fontes e 39 claims; 18 confirmadas + 7 refutadas = 25 com veredito, e as outras 14 nao tem veredito individual no retorno. EFEITO: o eixo gerenciado vs self-hosted (custo, TCO, requisitos B2B) ficou sem nenhuma evidencia confirmada, e a aplicabilidade ao contexto regulado da GMill (LGPD, ANVISA) nao foi avaliada.'
    trace: 'https://guptadeepak.com/ciam-compass/guides/ciam-pricing-at-scale-2026/'

