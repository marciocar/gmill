  # ═══════════════════ TOKENS: OAUTH 2.1 E DPOP ═══════════════════

  - id: E_DPOP_REPLAY_DETECTION
    node_type: evidence
    plane: DEV
    status: confirmed
    impact: 4
    confidence: 0.95
    verified_at: 2026-09-30
    verified_against: 'https://rfc-editor.org/info/rfc9449 — votos 3-0'
    valid_from: 2023-09
    source_tier: 10
    source_kind: primary
    label: 'O RFC 9449 (DPoP) define um mecanismo na camada de aplicacao que permite detectar replay de access tokens e refresh tokens do OAuth 2.0.'
    trace: 'https://rfc-editor.org/info/rfc9449'

  - id: E_DPOP_SENDER_CONSTRAINING
    node_type: evidence
    plane: DEV
    status: confirmed
    impact: 4
    confidence: 0.95
    verified_at: 2026-09-30
    verified_against: 'https://rfc-editor.org/info/rfc9449 — votos 3-0'
    valid_from: 2023-09
    source_tier: 10
    source_kind: primary
    label: 'O DPoP faz sender-constraining de access e refresh tokens OAuth com provas em JWT enviadas a cada requisicao, o que serve a apps de navegador e mobile que nao tem mTLS de cliente.'
    trace: 'https://rfc-editor.org/info/rfc9449'

  - id: E_OAUTH21_NO_IMPLICIT_PKCE
    node_type: evidence
    plane: DEV
    status: confirmed
    impact: 5
    confidence: 0.9
    verified_at: 2026-09-30
    verified_against: 'https://datatracker.ietf.org/doc/draft-ietf-oauth-v2-1/ — draft -16, votos 3-0'
    source_tier: 9
    source_kind: primary
    label: 'O draft do OAuth 2.1 (draft-ietf-oauth-v2-1-16) remove o Implicit grant e exige PKCE (S256) no fluxo authorization code.'
    trace: 'https://datatracker.ietf.org/doc/draft-ietf-oauth-v2-1/'

  - id: E_OAUTH21_EXACT_REDIRECT
    node_type: evidence
    plane: DEV
    status: confirmed
    impact: 4
    confidence: 0.9
    verified_at: 2026-09-30
    verified_against: 'https://datatracker.ietf.org/doc/draft-ietf-oauth-v2-1/ — votos 3-0'
    source_tier: 9
    source_kind: primary
    label: 'O OAuth 2.1 exige correspondencia exata de redirect URI: o servidor de autorizacao deve rejeitar redirect URI que nao case exatamente com o registrado (em loopback a porta pode variar).'
    trace: 'https://datatracker.ietf.org/doc/draft-ietf-oauth-v2-1/'

  - id: E_OAUTH21_SENDER_CONSTRAINED_SHOULD
    node_type: evidence
    plane: DEV
    status: confirmed
    impact: 4
    confidence: 0.9
    verified_at: 2026-09-30
    verified_against: 'https://datatracker.ietf.org/doc/draft-ietf-oauth-v2-1/ — votos 3-0'
    source_tier: 9
    source_kind: primary
    label: 'O OAuth 2.1 recomenda (SHOULD) access tokens sender-constrained via DPoP (RFC 9449) ou mTLS (RFC 8705), afastando o modelo bearer puro.'
    trace: 'https://datatracker.ietf.org/doc/draft-ietf-oauth-v2-1/'

