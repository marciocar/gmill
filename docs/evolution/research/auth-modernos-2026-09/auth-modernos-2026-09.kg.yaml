  # Corpus conferido antes (clausula 0): termos "sistemas, de, auth, modernos" → 1 grafo, 5 nos, todos
  # de docs/onion/graph/onion-adoption.kg.yaml (THIS_REPO, ONION_INSTALLED, DETERMINISTIC_GATE,
  # Q_WHAT_IS_THIS_REPO_DOMAIN, D_ADOPT_ONION). Nenhum trata de autenticacao — o casamento foi pelo
  # termo generico "de". Logo NAO ha SUPERSEDES/REFUTES cross-grafo: ausencia MEDIDA, nao esquecida.
