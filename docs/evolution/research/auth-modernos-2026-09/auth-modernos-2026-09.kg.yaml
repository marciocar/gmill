  #
  # Pergunta: sistemas de autenticacao modernos (estado da arte 2026) — passkeys/WebAuthn/FIDO2,
  # OAuth 2.1/OIDC, IdP/CIAM gerenciado vs self-hosted, sessoes e tokens, MFA, zero-trust, adocao.
