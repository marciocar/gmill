meta:
  id: diagnostico-aula1-mentimeter-gmill
  layer: audit
  schema_version: "1"
  baseline: "2026-10-21"
  date: "2026-10-21"
  review_after: "2026-12-31"
  purpose: |
    Diagnóstico inicial da turma GMill (Mentimeter da aula 1): dores, expectativas e limites.
    Mapa das respostas da pesquisa "Diagnóstico AI TECH 05082026", aplicada no início da aula 1 do
    curso. Fonte: dois prints que o maestro anexou em 2026-10-21 (aba Questions e aba Participants).
    Sessão ANÔNIMA: os participantes aparecem só como P1..P26, e assim ficam aqui. As evidências (E_*)
    são transcrição dos prints. As afirmações (C_*) são a minha leitura das respostas livres, uma
    categoria por resposta: ficam `open` até a turma confirmar (Q_VALIDAR_DORES_COM_A_TURMA).
  note: |
    Leia com: bash .claude/validation/kg-radar.sh docs/onion/graph/diagnostico-aula1-mentimeter.kg.yaml
    E_* = o que a turma respondeu, com contagens. C_* = as dores e expectativas que as respostas
    sustentam (SUPPORTS). D_* = sugestões de uso no curso (DEPENDS_ON das afirmações). Q_* = o que falta saber.

